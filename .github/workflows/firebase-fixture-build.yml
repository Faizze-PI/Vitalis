name: Firebase test package build
on:
  push:
    branches: [ci/firebase-fixture-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned versions
        id: policy
        shell: bash
        run: |
          node -e 'const p = require("./tool/toolchain_policy.json"); for (const k of ["flutter", "jdk"]) { if (!/^\d+\.\d+\.\d+$/.test(p[k])) throw new Error("Invalid version"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + p[k] + "\n"); }'
      - uses: ./.github/actions/setup
        with:
          flutter: ${{ steps.policy.outputs.flutter }}
          jdk: ${{ steps.policy.outputs.jdk }}
      - name: Resolve locked dependencies
        run: ./tool/run_gate.sh pub get --enforce-lockfile
      - name: Build arm64 debug app
        run: ./tool/run_gate.sh build apk --debug --target-platform android-arm64 --no-pub
      - name: Build instrumentation APK
        run: dart tool/generation_lock.dart -- bash -c 'cd android && ./gradlew :app:assembleDebugAndroidTest --console=plain'
      - name: Record package provenance
        run: |
          mkdir -p .ci-evidence/firebase-packages
          git rev-parse HEAD > .ci-evidence/firebase-packages/source.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > .ci-evidence/firebase-packages/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebase-test-packages
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            .ci-evidence/firebase-packages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  firebase:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firebase-test-packages
      - name: Verify APK provenance
        shell: bash
        run: |
          test "$(cat .ci-evidence/firebase-packages/source.txt)" = "$GITHUB_SHA"
          sha256sum --check .ci-evidence/firebase-packages/sha256.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1062544787963/locations/global/workloadIdentityPools/vitalis-github/providers/github
          service_account: vitalis-gh-testlab@vitalis-c94ea.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Run Android instrumentation on API 28 and 35
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence/firebase-results
          gcloud firebase test android run --project=vitalis-c94ea --type=instrumentation \
            --app=build/app/outputs/flutter-apk/app-debug.apk \
            --test=build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device=model=MediumPhone.arm,version=28,locale=en,orientation=portrait \
            --device=model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --timeout=5m --quiet --format=json \
            > .ci-evidence/firebase-results/results.json \
            2> >(tee .ci-evidence/firebase-results/gcloud.log >&2)
      - name: Retain Firebase run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebase-instrumentation-results
          path: .ci-evidence/firebase-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
