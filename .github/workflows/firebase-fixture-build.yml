name: Firebase test package build
on:
  push:
    branches: [ci/firebase-fixture-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned versions
        id: policy
        shell: bash
        run: |
          node -e 'const p = require("./tool/toolchain_policy.json"); for (const k of ["flutter", "jdk"]) { if (!/^\d+\.\d+\.\d+$/.test(p[k])) throw new Error("Invalid version"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + p[k] + "\n"); }'
      - uses: ./.github/actions/setup
        with:
          flutter: ${{ steps.policy.outputs.flutter }}
          jdk: ${{ steps.policy.outputs.jdk }}
      - name: Resolve locked dependencies
        run: ./tool/run_gate.sh pub get --enforce-lockfile
      - name: Build arm64 debug app
        run: ./tool/run_gate.sh build apk --debug --target-platform android-arm64 --no-pub
      - name: Build instrumentation APK
        run: dart tool/generation_lock.dart -- bash -c 'cd android && ./gradlew :app:assembleDebugAndroidTest --console=plain'
      - name: Record package provenance
        run: |
          mkdir -p .ci-evidence/firebase-packages
          git rev-parse HEAD > .ci-evidence/firebase-packages/source.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk > .ci-evidence/firebase-packages/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebase-test-packages
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            .ci-evidence/firebase-packages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
