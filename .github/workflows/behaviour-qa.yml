name: Behaviour, API, security and load qualification
on:
  workflow_dispatch:
  push:
    branches: [ci/behavior-security-load-20261104]
permissions:
  contents: read
concurrency:
  group: behaviour-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build unchanged arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: policy
        run: node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("tool/toolchain_policy.json")); for(const k of ["flutter","jdk"])fs.appendFileSync(process.env.GITHUB_OUTPUT,k+"="+p[k]+"\n");'
      - uses: ./.github/actions/setup
        with:
          flutter: ${{ steps.policy.outputs.flutter }}
          jdk: ${{ steps.policy.outputs.jdk }}
      - run: ./tool/run_gate.sh pub get --enforce-lockfile
      - run: ./tool/run_gate.sh build apk --debug --target-platform android-arm64 --no-pub
      - name: APK source and identity
        run: |
          git rev-parse HEAD > build/app/outputs/flutter-apk/source.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: QA-arm64-APK
          path: build/app/outputs/flutter-apk/
          retention-days: 14
          if-no-files-found: error
  selenium:
    name: Selenium and public API contracts (300+)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QA_SUITE: selenium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - run: python tool/qa/test_reporting.py
      - run: python tool/qa/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-selenium-Excel-and-evidence
          path: .qa-results/selenium/
          retention-days: 30
          if-no-files-found: error
  appium:
    name: Appium APK compatibility (300+)
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_SUITE: appium
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: QA-arm64-APK
          path: .qa-apk
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned Appium and driver
        run: |
          npm install --global appium@3.9.0
          appium driver install uiautomator2@9.0.1
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/qa/android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-appium-Excel-and-evidence
          path: .qa-results/appium/
          retention-days: 30
          if-no-files-found: error
  bas:
    name: BAS defensive regressions (300+)
    needs: [appium, selenium]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_SUITE: bas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - id: policy
        run: node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync("tool/toolchain_policy.json")); for(const k of ["flutter","jdk"])fs.appendFileSync(process.env.GITHUB_OUTPUT,k+"="+p[k]+"\n");'
      - uses: ./.github/actions/setup
        with:
          flutter: ${{ steps.policy.outputs.flutter }}
          jdk: ${{ steps.policy.outputs.jdk }}
      - run: ./tool/run_gate.sh pub get --enforce-lockfile
      - run: python tool/qa/test_reporting.py
      - run: python tool/qa/run.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-bas-Excel-and-evidence
          path: .qa-results/bas/
          retention-days: 30
          if-no-files-found: error
  dast:
    name: Native APK dynamic security (300+)
    needs: [build, bas]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_SUITE: dast
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: QA-arm64-APK
          path: .qa-apk
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned Appium and driver
        run: |
          npm install --global appium@3.9.0
          appium driver install uiautomator2@9.0.1
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/qa/android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-dast-Excel-and-evidence
          path: .qa-results/dast/
          retention-days: 30
          if-no-files-found: error
  load:
    name: Sequential app load (300+)
    needs: [build, dast]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_SUITE: load
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: QA-arm64-APK
          path: .qa-apk
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned Appium and driver
        run: |
          npm install --global appium@3.9.0
          appium driver install uiautomator2@9.0.1
      - name: Enable hosted-runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/qa/android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-load-Excel-and-evidence
          path: .qa-results/load/
          retention-days: 30
          if-no-files-found: error
  bundle:
    name: Downloadable combined Excel reports
    needs: [selenium, appium, bas, dast, load]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QA_JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: VITALIS-*-Excel-and-evidence
          path: .qa-bundle
      - name: Produce combined outcome report
        run: python tool/qa/bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: VITALIS-Test-Execution-Reports-Bundle
          path: .qa-bundle/
          retention-days: 30
          if-no-files-found: error
