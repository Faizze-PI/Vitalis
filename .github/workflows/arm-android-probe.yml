name: Native ARM Appium navigation environment probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  navigation:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      QA_SUITE: appium
      QA_ANDROID_CONTAINER: vitalis-navigation-probe
      ANDROID_SERIAL: 127.0.0.1:5555
      QA_NAVIGATION_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r tool/qa/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --global appium@3.9.0 && appium driver install uiautomator2@8.7.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: QA-arm64-APK
          path: .qa-apk
          run-id: '41843497240'
          github-token: ${{ github.token }}
      - name: Execute five environment checks, not the acceptance suite
        run: bash tool/qa/native_android.sh
      - name: Retain diagnostics
        if: always()
        run: |
          mkdir -p .qa-results/appium
          docker logs "$QA_ANDROID_CONTAINER" > .qa-results/appium/container.log 2>&1 || true
          docker rm -f "$QA_ANDROID_CONTAINER" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-arm-navigation-environment-only
          path: .qa-results/appium/
          retention-days: 14
          if-no-files-found: error
