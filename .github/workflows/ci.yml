name: Full qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      flutter: ${{ steps.policy.outputs.flutter }}
      jdk: ${{ steps.policy.outputs.jdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: policy
        shell: bash
        run: |
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("tool/toolchain_policy.json", "utf8")); for (const k of ["flutter", "jdk"]) { if (!/^\d+\.\d+\.\d+$/.test(p[k])) throw new Error("Invalid policy version"); fs.appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + p[k] + "\n"); }'

  analyze:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.policy.outputs.jdk }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - name: Configure isolated gate environment
        shell: bash
        run: |
          echo "VITALIS_FLUTTER_SDK=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.gate-cache/pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gate-cache/gradle" >> "$GITHUB_ENV"
          commit=$(node -p 'require("./third_party/llm_llamacpp/native/llama_cpp.lock.json").commit')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid native source lock' >&2; exit 2; }
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native-build/llama-$commit/linux-x64-cpu/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
      - run: dart tool/verify_toolchain_policy.dart
      - name: Verify native bootstrap transport deadline
        run: dart tool/test_gradle_wrapper_timeout.dart android/gradle/wrapper/gradle-wrapper.jar "$JAVA_HOME/bin/java"
      - run: dart tool/test_generation_lock.dart
      - run: dart tool/test_generation_lock_termination.dart
      - name: Install pinned Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$(dart tool/verify_toolchain_policy.dart --value compileSdk)" "ndk;$(dart tool/verify_toolchain_policy.dart --value ndk)"
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get --enforce-lockfile
      - name: Resolve vendored analysis dependencies
        run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get --enforce-lockfile
        working-directory: third_party/llm_llamacpp
      - run: dart format --output=none --set-exit-if-changed lib test test_native tool third_party/llm_llamacpp/lib third_party/llm_llamacpp/test third_party/llm_llamacpp/hook
      - run: dart run tool/verify_hardcode_register.dart
      - run: dart tool/verify_ci_workflow.dart
      - run: dart tool/test_ci_workflow.dart
      - run: dart tool/test_coverage_integrity.dart
      - name: Verify immutable Android test selectors offline
        run: dart tool/generation_lock.dart -- dart tool/test_android_dependency_policy.dart
      - run: node tool/test_ci_acceptance.js
      - run: node tool/test_split_fixture_builder.js
      - name: Test-only native fault compile-mode gate
        run: dart tool/generation_lock.dart -- dart tool/verify_runtime_fault_modes.dart
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" analyze --fatal-warnings
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" analyze --fatal-warnings
        working-directory: third_party/llm_llamacpp

  test:
    needs: [policy, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.policy.outputs.jdk }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - name: Configure isolated gate environment
        shell: bash
        run: |
          echo "VITALIS_FLUTTER_SDK=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.gate-cache/pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gate-cache/gradle" >> "$GITHUB_ENV"
          commit=$(node -p 'require("./third_party/llm_llamacpp/native/llama_cpp.lock.json").commit')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid native source lock' >&2; exit 2; }
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native-build/llama-$commit/linux-x64-cpu/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
      - run: dart tool/verify_toolchain_policy.dart
      - run: dart tool/test_generation_lock.dart
      - run: dart tool/test_generation_lock_termination.dart
      - name: Install pinned Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$(dart tool/verify_toolchain_policy.dart --value compileSdk)" "ndk;$(dart tool/verify_toolchain_policy.dart --value ndk)"
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get
      - name: Select report Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify the pinned Excel reporter
        if: always()
        run: |
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r tool/reporting/requirements.txt
          python -B -m unittest discover -s tool/reporting -p 'test_*.py'
      - run: |
          set -o pipefail
          mkdir -p .ci-evidence/root
          git rev-parse HEAD > .ci-evidence/root/source.txt
          "$GITHUB_WORKSPACE/tool/run_gate.sh" test test test_benchmarks --coverage '--coverage-package=vitalis_app|llm_llamacpp' --test-randomize-ordering-seed=random --machine 2>&1 | tee .ci-evidence/root/machine.log
          cp coverage/lcov.info .ci-evidence/root/lcov.info
        env:
          VITALIS_VALIDATION_METRICS: ${{ github.workspace }}/.ci-evidence/root/metrics.jsonl
      - name: Generate qualification Excel reports
        if: always()
        run: |
          python -B tool/reporting/validation_report.py --directory .ci-evidence/root --root "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain downloadable qualification Excel reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VITALIS-Full-Qualification-Excel
          path: |
            .ci-evidence/root/*.xlsx
            .ci-evidence/root/*.json
            .ci-evidence/root/*.csv
            .ci-evidence/root/*.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: root-test-evidence
          path: .ci-evidence/root
          include-hidden-files: true
          if-no-files-found: error

  native-text-runtime:
    needs: [policy, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.policy.outputs.jdk }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - name: Configure isolated gate environment
        shell: bash
        run: |
          echo "VITALIS_FLUTTER_SDK=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.gate-cache/pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gate-cache/gradle" >> "$GITHUB_ENV"
          commit=$(node -p 'require("./third_party/llm_llamacpp/native/llama_cpp.lock.json").commit')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid native source lock' >&2; exit 2; }
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native-build/llama-$commit/linux-x64-cpu/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
      - run: dart tool/verify_toolchain_policy.dart
      - run: dart tool/test_generation_lock.dart
      - run: dart tool/test_generation_lock_termination.dart
      - name: Install pinned Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$(dart tool/verify_toolchain_policy.dart --value compileSdk)" "ndk;$(dart tool/verify_toolchain_policy.dart --value ndk)"
      - name: Read fixture authority from application manifest
        shell: bash
        run: |
          dart tool/export_bundled_model_manifest.dart > "$RUNNER_TEMP/vitalis-model.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const model = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'vitalis-model.json'), 'utf8'));
          const values = {
            MODEL_PATH: path.join(process.env.GITHUB_WORKSPACE, '.ci-model-cache', model.fileName),
            MODEL_SHA256: model.sha256,
            MODEL_URL: model.url,
          };
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Invalid fixture environment value');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-model-cache
          key: bundled-qwen-${{ env.MODEL_SHA256 }}
      - name: Resolve immutable bundled model
        run: |
          mkdir -p .ci-model-cache
          if ! echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check --status; then
            curl --fail --location --retry 4 --output "$MODEL_PATH.part" "$MODEL_URL"
            echo "$MODEL_SHA256  $MODEL_PATH.part" | sha256sum --check
            mv "$MODEL_PATH.part" "$MODEL_PATH"
          fi
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get
        working-directory: third_party/llm_llamacpp
      - name: Native text runtime gate (zero skips)
        run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" test test/vitalis_text_runtime_gate_test.dart
        working-directory: third_party/llm_llamacpp
        env:
          VITALIS_TEST_MODEL: ${{ env.MODEL_PATH }}
          VITALIS_TEST_MODEL_SHA256: ${{ env.MODEL_SHA256 }}
      - name: Resolve root dependencies for registry ownership gate
        run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get
      - name: Prepare hash-locked split GGUF fixture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence/native
          node tool/build_split_test_fixture.js --model "$MODEL_PATH" --output-parent "$RUNNER_TEMP" --max-shard-size 300M --parallel 2 2>&1 | tee .ci-evidence/native/split-helper-build.txt
      - name: Collect complete native lifecycle coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence/native
          git rev-parse HEAD > .ci-evidence/native/source.txt
          printf '%s\n' "$MODEL_SHA256" > .ci-evidence/native/model-sha256.txt
          mapfile -t cases < <(find test_native -maxdepth 1 -name '*_test.dart' ! -name helper_cleanup_fault_test.dart | sort)
          test "${#cases[@]}" -gt 0
          "$GITHUB_WORKSPACE/tool/run_gate.sh" test "${cases[@]}" --concurrency=1 --dart-define=VITALIS_RUNTIME_FAULT_TESTS=false --coverage '--coverage-package=vitalis_app|llm_llamacpp' --reporter expanded --file-reporter json:.ci-evidence/native/machine.log 2>&1 | tee .ci-evidence/native/tests.txt
          cp coverage/lcov.info .ci-evidence/native/lcov.info
        env:
          VITALIS_TEST_MODEL: ${{ env.MODEL_PATH }}
          VITALIS_SPLIT_TEST_FIXTURE: ${{ env.VITALIS_SPLIT_TEST_FIXTURE }}
      - name: Collect isolated native fault coverage
        shell: bash
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/tool/run_gate.sh" test test_native/helper_cleanup_fault_test.dart --dart-define=VITALIS_RUNTIME_FAULT_TESTS=true --coverage '--coverage-package=vitalis_app|llm_llamacpp' --reporter expanded --file-reporter json:.ci-evidence/native/fault-machine.log 2>&1 | tee .ci-evidence/native/fault-tests.txt
          cp coverage/lcov.info .ci-evidence/native/fault-lcov.info
        env:
          VITALIS_TEST_MODEL: ${{ env.MODEL_PATH }}
      - name: Cancellation bridge lifetime sanitizer gate
        shell: bash
        run: |
          commit=$(node -p "require('./third_party/llm_llamacpp/native/llama_cpp.lock.json').commit")
          source="$GITHUB_WORKSPACE/.native-build/llama-$commit/llama.cpp-$commit"
          cmake -S third_party/llm_llamacpp/native/tests -B .native-build/cancel-lifetime \
            "-DVITALIS_LLAMA_SOURCE=$source" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .native-build/cancel-lifetime --parallel 2
          ASAN_OPTIONS=halt_on_error=1 ctest --test-dir .native-build/cancel-lifetime --output-on-failure
      - name: Select native report Python
        if: always()
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Generate native suite Excel reports
        if: always()
        run: |
          python -B -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r tool/reporting/requirements.txt
          python -B -m unittest discover -s tool/reporting -p 'test_*.py'
          python -B tool/reporting/native_report.py --directory .ci-evidence/native --root "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Retain downloadable native Excel
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VITALIS-Native-Runtime-Excel
          path: .ci-evidence/native/reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-test-evidence
          path: .ci-evidence/native
          include-hidden-files: true
          if-no-files-found: error

  lifecycle-coverage:
    needs: [policy, test, native-text-runtime, windows-android-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: root-test-evidence
          path: .ci-evidence/root
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-test-evidence
          path: .ci-evidence/native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-storage-coverage
          path: .ci-evidence/windows-storage
      - name: Verify matching source and expanded coverage
        shell: bash
        run: |
          test "$(cat .ci-evidence/root/source.txt)" = "$GITHUB_SHA"
          test "$(cat .ci-evidence/native/source.txt)" = "$GITHUB_SHA"
          test "$(cat .ci-evidence/windows-storage/source.txt)" = "$GITHUB_SHA"
          dart tool/verify_coverage.dart .ci-evidence/root/lcov.info .ci-evidence/windows-storage/lcov.info
          dart tool/verify_coverage.dart --native-lifecycle .ci-evidence/root/lcov.info .ci-evidence/windows-storage/lcov.info .ci-evidence/native/lcov.info .ci-evidence/native/fault-lcov.info

  windows-android-host:
    needs: policy
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          flutter: ${{ needs.policy.outputs.flutter }}
          jdk: ${{ needs.policy.outputs.jdk }}
      - name: Verify scoped Java sockets without JDK patches
        shell: pwsh
        run: dart tool/test_java_socket_policy.dart "$env:GITHUB_WORKSPACE/android/gradlew.bat" "$env:JAVA_HOME" "$env:RUNNER_TEMP"
      - name: Collect Windows storage adapter coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-evidence/windows-storage | Out-Null
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE/.ci-evidence/windows-storage/source.txt", $source, [Text.UTF8Encoding]::new($false))
          ./tool/run_gate.ps1 pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tool/run_gate.ps1 test test/services/model_storage_preflight_test.dart --no-pub --coverage '--coverage-package=vitalis_app|llm_llamacpp' --concurrency=1 --reporter expanded 2>&1 | Tee-Object .ci-evidence/windows-storage/tests.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item coverage/lcov.info .ci-evidence/windows-storage/lcov.info
      - name: Retain Windows adapter evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-storage-coverage
          path: .ci-evidence/windows-storage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  acceptance:
    if: always()
    needs: [analyze, test, native-text-runtime, lifecycle-coverage, build-android, android-instrumentation, build-android-release, windows-android-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all mandatory jobs to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: node tool/verify_ci_acceptance.js

  build-android:
    needs: [policy, lifecycle-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.policy.outputs.jdk }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - name: Configure isolated gate environment
        shell: bash
        run: |
          echo "VITALIS_FLUTTER_SDK=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.gate-cache/pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gate-cache/gradle" >> "$GITHUB_ENV"
          commit=$(node -p 'require("./third_party/llm_llamacpp/native/llama_cpp.lock.json").commit')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid native source lock' >&2; exit 2; }
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native-build/llama-$commit/linux-x64-cpu/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
      - run: dart tool/verify_toolchain_policy.dart
      - run: dart tool/test_generation_lock.dart
      - run: dart tool/test_generation_lock_termination.dart
      - name: Install pinned Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$(dart tool/verify_toolchain_policy.dart --value compileSdk)" "ndk;$(dart tool/verify_toolchain_policy.dart --value ndk)"
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" build apk --debug --target-platform android-arm64
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" build apk --profile --target-platform android-arm64
      - name: Verify measured Android transfer recovery coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-evidence/android-transfer
          git rev-parse HEAD > .ci-evidence/android-transfer/source.txt
          dart tool/generation_lock.dart -- bash -c 'cd android && ./gradlew :app:transferCoverageVerify :app:compileDebugAndroidTestJavaWithJavac lintDebug --console=plain' 2>&1 | tee .ci-evidence/android-transfer/gates.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-transfer-evidence
          path: |
            .ci-evidence/android-transfer
            build/app/reports/jacoco/
            build/app/test-results/
            build/app/jacoco/
          if-no-files-found: error

  android-instrumentation:
    needs: [policy, build-android]
    # Required infrastructure; no hosted x86 substitute or inferred pass.
    runs-on: [self-hosted, vitalis-arm64-emulator]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.policy.outputs.jdk }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.policy.outputs.flutter }}
          channel: stable
      - name: Configure isolated gate environment
        shell: bash
        run: |
          echo "VITALIS_FLUTTER_SDK=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.gate-cache/pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$GITHUB_WORKSPACE/.gate-cache/gradle" >> "$GITHUB_ENV"
          commit=$(node -p 'require("./third_party/llm_llamacpp/native/llama_cpp.lock.json").commit')
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid native source lock' >&2; exit 2; }
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native-build/llama-$commit/linux-x64-cpu/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          flutter config --jdk-dir "$JAVA_HOME" --android-sdk "$ANDROID_HOME"
      - run: dart tool/verify_toolchain_policy.dart
      - run: dart tool/test_generation_lock.dart
      - run: dart tool/test_generation_lock_termination.dart
      - name: Install pinned Android components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$(dart tool/verify_toolchain_policy.dart --value compileSdk)" "ndk;$(dart tool/verify_toolchain_policy.dart --value ndk)"
      - run: |
          "$GITHUB_WORKSPACE/tool/run_gate.sh" pub get
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Separate arm64 support-floor and modern UIDT runtime gates.
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          script: |
            mkdir -p .ci-evidence/instrumentation
            git rev-parse HEAD > .ci-evidence/instrumentation/source.txt
            adb shell getprop > .ci-evidence/instrumentation/device-properties.txt
            dart tool/generation_lock.dart -- bash -c 'cd android && ./gradlew connectedDebugAndroidTest --console=plain'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-instrumentation-${{ matrix.api-level }}
          path: |
            .ci-evidence/instrumentation
            build/app/outputs/androidTest-results/
            build/app/reports/androidTests/
          if-no-files-found: error

